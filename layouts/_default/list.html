{{ partial "header" . }}

{{ $posts := .Pages.ByDate.Reverse }}

<div class="content">
  <main>
    <section class="page-title">
      <h1>{{ .Title }}</h1>
      <p>{{ len $posts }} posts</p>
    </section>
    <ul class="article-list">
      {{ range $posts }}
      <li>
        <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
      </li>
      {{ end }}
    </ul>
  </main>
</div>

{{ partial "footer" . }}
