{{ partial "header" . }}

{{ $posts := first 5 (where .Site.RegularPages "Section" "posts") }}

<div class="content">
  <main>
    <section class="page-title">
      <h1>posts</h1>
    </section>
    <ul class="article-list">
      {{ range $posts }}
      <li>
        <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
      </li>
      {{ end }}
    </ul>
  </main>
</div>

{{ partial "footer" . }}
